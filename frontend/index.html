<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Track A — Credit Risk Scoring</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header>
  <h1>Track A · Credit Risk Scoring</h1>
  <nav>
    <a href="index.html" class="active">Score an applicant</a>
    <a href="batch.html">Batch scoring</a>
  </nav>
</header>

<main>
  <div class="panel">
    <h2>Applicant details</h2>
    <p class="hint" id="hint">Loading required fields from the model...</p>
    <form id="applicant-form">
      <div class="field-grid" id="field-grid"></div>
      <button type="submit" id="submit-btn" disabled>Score applicant</button>
      <div class="spinner" id="spinner">Scoring...</div>
      <div class="error" id="error"></div>
    </form>
  </div>

  <div class="panel result-card" id="result-card">
    <h2>Result</h2>
    <div class="score-row">
      <div class="score-number" id="score-number">—</div>
      <div class="score-bar-track"><div class="score-bar-fill" id="score-bar" style="width:0%"></div></div>
    </div>
    <div>
      <span class="badge" id="decision-badge">—</span>
      <span class="rating-pill" id="rating-pill"></span>
    </div>
    <div class="reasons" id="reasons"></div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
